# Continuous delivery: after CI succeeds on main, build images, push to Artifact Registry and deploy to Cloud Run.
# One-time setup (see cicd/README.md): Workload Identity Federation + these repository variables/secrets:
#   vars.GCP_PROJECT, vars.GCP_REGION, vars.AR_REPO, secrets.WIF_PROVIDER, secrets.WIF_SERVICE_ACCOUNT
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.AR_REPO }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push server
        run: |
          docker build -f Legacy_enterprise_migration/cicd/docker/Dockerfile.server -t "$REGISTRY/studio-server:$TAG" Legacy_enterprise_migration
          docker push "$REGISTRY/studio-server:$TAG"
      - name: Deploy server
        run: |
          gcloud run deploy studio-server --image "$REGISTRY/studio-server:$TAG" --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated --memory 2Gi --cpu 2 --timeout 3600 --max-instances 1 \
            --set-env-vars "SRC=/data/carddemo/app" --set-secrets "GEMINI_API_KEY=gemini-api-key:latest"
      - name: Resolve server URL
        id: api
        run: echo "url=$(gcloud run services describe studio-server --region '${{ vars.GCP_REGION }}' --format 'value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Build and push client
        run: |
          docker build -f Legacy_enterprise_migration/cicd/docker/Dockerfile.client --build-arg API_UPSTREAM="${{ steps.api.outputs.url }}" \
            -t "$REGISTRY/studio-client:$TAG" Legacy_enterprise_migration
          docker push "$REGISTRY/studio-client:$TAG"
      - name: Deploy client
        run: gcloud run deploy studio-client --image "$REGISTRY/studio-client:$TAG" --region "${{ vars.GCP_REGION }}" --allow-unauthenticated

      - name: Smoke test
        run: |
          curl -fsS "${{ steps.api.outputs.url }}/api/health"
          echo "Studio: $(gcloud run services describe studio-client --region '${{ vars.GCP_REGION }}' --format 'value(status.url)')" >> "$GITHUB_STEP_SUMMARY"
